[package]
name = "adt-console"
version = "0.1.0"
description = "ADT Operator Console"
authors = ["Sheridan"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }
chrono = "0.4"

[dependencies]
tauri = { version = "2.0.0", features = ["tray-icon"] }
tauri-plugin-shell = "2.0.0"
tauri-plugin-notification = "2.0.0"
tauri-plugin-global-shortcut = "2.0.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
env_logger = "0.10"
portable-pty = "0.8"
nix = "0.26"
tokio = { version = "1.0", features = ["full"] }
futures = "0.3"
actix-web = "4"
actix-cors = "0.6"
uuid = { version = "1.3", features = ["v4"] }
chrono = "0.4"
dirs = "6.0.0"
notify = "6.1.1"
