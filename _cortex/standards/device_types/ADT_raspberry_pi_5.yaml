# ADT Device Type Template -- Raspberry Pi 5
# SPEC-113 ss3.4 -- starter library
id: raspberry_pi_5
name: Raspberry Pi 5
capabilities:
  - ssh
  - sftp
  - gpio
  - usb_host
  - network

identification:
  # Pi 5 does not enumerate as a USB device on the host; access is via SSH.
  # Identification is by hostname resolution or fixed IP in the access_path.
  discovery_hint: "ssh {hostname} 'cat /proc/device-tree/model' 2>/dev/null | grep 'Raspberry Pi 5'"
  model_string: "Raspberry Pi 5"

procedures:
  health:
    protocol: ssh
    command: "echo OK"
    expect: "OK"
    timeout_ms: 5000

  deploy:
    protocol: sftp
    description: "Upload a file to the Pi via SFTP."
    args: "sftp {credentials_ref}@{hostname}:{remote_path} <<< $'put {artifact}'"

  reboot:
    protocol: ssh
    command: "sudo reboot"
    confirm: true
    note: "Operator confirmation required before reboot."

  shell_exec:
    protocol: ssh
    command: "{command}"
    timeout_ms: 30000

safety_notes:
  - "Always use SSH key auth; password auth should be disabled in sshd_config."
  - "Reboots cause ~30s unavailability. Schedule during maintenance windows."
  - "GPIO operations from ADT must go through a managed script -- direct /dev/gpiomem access is unsupported by DTGP v1."
  - "SD card writes should be minimised; prefer tmpfs for scratch space."
