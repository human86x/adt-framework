# ADT Device Type Template -- Generic SSH Linux Host
# SPEC-113 ss3.4 -- starter library
# Used for servers, VMs, WSL instances, cloud hosts, etc.
id: ssh_linux_host
name: SSH Linux Host (generic)
capabilities:
  - ssh
  - sftp
  - network

identification:
  discovery_hint: "ssh -o ConnectTimeout=5 {hostname} 'uname -s' 2>/dev/null | grep -i linux"

procedures:
  health:
    protocol: ssh
    command: "echo OK && uptime"
    expect: "OK"
    timeout_ms: 10000

  shell_exec:
    protocol: ssh
    command: "{command}"
    timeout_ms: 60000

  deploy:
    protocol: sftp
    description: "Upload artifact via SFTP."
    args: "sftp {credentials_ref}@{hostname}:{remote_path} <<< $'put {artifact}'"

  service_restart:
    protocol: ssh
    command: "sudo systemctl restart {service_name}"
    timeout_ms: 30000

safety_notes:
  - "Always use SSH key auth; store key ref in vault as dtgp://creds/<ref>."
  - "sudo access may require NOPASSWD sudoers entry for automated commands."
  - "No flash procedure -- ssh_linux_host does not support firmware flashing."
