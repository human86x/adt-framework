# ADT Device Type Template -- Arduino Mega 2560
# SPEC-113 ss3.4 -- starter library
id: arduino_mega_2560
name: Arduino Mega 2560
capabilities:
  - usb_serial
  - flash
  - gpio

identification:
  # VID/PID documented: 2341:0042 (genuine Arduino), 2341:0010 (older bootloader variant)
  usb_vid: "2341"
  usb_pid: "0042"
  usb_pid_alt: "0010"
  discovery_hint: "avrdude -c wiring -p atmega2560 -P {port} -v 2>&1 | grep 'Device signature'"
  udev_rule: 'SUBSYSTEM=="tty", ATTRS{idVendor}=="2341", ATTRS{idProduct}=="0042", ATTRS{serial}=="{serial}", SYMLINK+="ttyUSB_{alias}"'

procedures:
  health:
    protocol: serial
    baudrate: 115200
    probe: "PING\n"
    expect: "PONG\n"
    timeout_ms: 2000

  flash:
    tool: avrdude
    args: "-c wiring -p atmega2560 -P {port} -b 115200 -U flash:w:{artifact}:i"
    verify: "avrdude -c wiring -p atmega2560 -P {port} -U flash:v:{artifact}:i"

  backup:
    tool: avrdude
    args: "-c wiring -p atmega2560 -P {port} -U flash:r:{out_path}:i"
    default_out_path: "_cortex/firmware_snapshots/{target_id}_{ts}.hex"

  reset:
    tool: stty
    args: "-F {port} hupcl"

safety_notes:
  - "Bootloader can be corrupted by wrong programmer setting (-c flag)."
  - "Undervoltage during flash produces silent partial writes. Ensure stable 5V supply."
  - "Use port_symlink (udev symlink), never bare /dev/ttyUSB<N> -- port numbers shift on reboot."
  - "wiring programmer type required for Mega 2560 bootloader (not arduino)."
